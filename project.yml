name: NitPicker
options:
  bundleIdPrefix: com.joaocadide
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  FFmpegKit:
    path: Packages/FFmpegKit
targets:
  NitPicker:
    type: application
    platform: macOS
    sources:
      - path: NitPicker
        excludes:
          - Resources/Info.plist
    dependencies:
      - package: FFmpegKit
    info:
      path: NitPicker/Resources/Info.plist
      properties:
        CFBundleName: Nit Picker
        CFBundleDisplayName: Nit Picker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.video
        NSHumanReadableCopyright: "Copyright © 2026 João Cadidé de Souza"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Movie
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
              - public.mpeg-4
              - com.apple.quicktime-movie
              - public.avi
              - org.matroska.mkv
              - org.webmproject.webm
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.matroska.mkv
            UTTypeDescription: Matroska Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [mkv]
              public.mime-type: [video/x-matroska]
          - UTTypeIdentifier: org.webmproject.webm
            UTTypeDescription: WebM Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [webm]
              public.mime-type: [video/webm]
    # Defined here, not in the file: XcodeGen rewrites the file from these properties.
    entitlements:
      path: NitPicker/Resources/NitPicker.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.bookmarks.app-scope: true
        # Phase 2's loopback HLS server. Verified in the sandboxed test host: without `server` the listener is
        # denied, and without `client` AVPlayer can't reach it (playback never starts).
        com.apple.security.network.server: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaocadide.nitpicker
        PRODUCT_NAME: NitPicker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readonly
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  NitPickerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - NitPickerTests
    dependencies:
      - target: NitPicker
      - package: FFmpegKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaocadide.nitpicker.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NitPicker.app/Contents/MacOS/NitPicker
schemes:
  NitPicker:
    build:
      targets:
        NitPicker: all
        NitPickerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NitPickerTests
